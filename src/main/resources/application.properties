spring.application.name=biblioteca
spring.main.lazy-initialization=true

# --- PUERTO---
server.port=${PORT:8080}
# Agregamos esto para que Spring sepa que está tras el proxy de Render (ayuda con los redirects)
server.forward-headers-strategy=framework

# --- DOCUMENTACION ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# --- BASE DE DATOS ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- GMAIL (AJUSTADO PARA RENDER) ---
spring.mail.host=smtp.gmail.com
# CAMBIO CLAVE: Usamos puerto 465 en lugar de 587
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=javamail

# CAMBIO CLAVE: Activamos SSL y desactivamos StartTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# Tiempos de espera aumentados (para evitar timeouts)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Usamos la misma variable de usuario para el remitente
app.mail.from=Biblioteca ESCOM <${MAIL_USERNAME}>