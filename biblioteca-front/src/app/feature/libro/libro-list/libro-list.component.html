<div class="container mt-4">
    <h2>Catálogo de Libros</h2>
    <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let libro of libros">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ libro.titulo }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ libro.editorial }} - {{ libro.anio }}</h6>
                    <p class="card-text">{{ libro.sinopsis | slice:0:100 }}...</p>
                    <a href="#" class="card-link">Ver detalles</a>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="libros.length === 0" class="alert alert-info">
        No hay libros disponibles o no se ha podido conectar con el servidor.
    </div>
</div>
