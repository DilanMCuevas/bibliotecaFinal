<div class="container mt-4">
    <h2>Catálogo de Libros</h2>
    <div *ngIf="loading" class="text-center my-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2">Cargando datos...</p>
    </div>

    <div *ngIf="!loading && error" class="alert alert-danger">
        Error al conectar con el servidor. Por favor intenta más tarde.
    </div>

    <div *ngIf="!loading && !error && libros.length === 0" class="alert alert-info">
        No hay libros disponibles en este momento.
    </div>

    <div class="row" *ngIf="!loading && !error && libros.length > 0">
        <div class="col-md-4 mb-4" *ngFor="let libro of libros">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ libro.titulo }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ libro.editorial }} - {{ libro.anio }}</h6>
                    <p class="card-text">{{ libro.sinopsis | slice:0:100 }}...</p>
                    <a href="#" class="card-link">Ver detalles</a>
                </div>
            </div>
        </div>
    </div>
</div>
