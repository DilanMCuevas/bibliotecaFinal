<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gestión de Usuarios</h2>
        <a routerLink="/usuarios/nuevo" class="btn btn-primary">
            <i class="bi bi-person-plus-fill"></i> Nuevo Usuario
        </a>
    </div>

    <table class="table table-bordered">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let u of usuarios">
                <td>{{ u.id }}</td>
                <td>{{ u.nombre }}</td>
                <td>{{ u.email }}</td>
                <td>
                    <span class="badge"
                        [ngClass]="{'bg-success': u.rol === 'admin', 'bg-info': u.rol === 'miembro'}">
                        {{ u.rol }}
                    </span>
                </td>
                <td>{{ u.estado }}</td>
                <td>
                    <button class="btn btn-sm btn-danger" (click)="eliminar(u.id!)">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <div *ngIf="usuarios.length === 0" class="alert alert-warning">
        No hay usuarios registrados.
    </div>
</div>
