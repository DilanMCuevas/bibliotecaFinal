<div class="container mt-4">
    <h2>Nuevo Usuario</h2>
    <form (ngSubmit)="guardar()" #userForm="ngForm">
        <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" [(ngModel)]="usuario.nombre" name="nombre" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" [(ngModel)]="usuario.email" name="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="usuario.password" name="password" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Rol</label>
                <select class="form-select" [(ngModel)]="usuario.rol" name="rol">
                    <option value="miembro">Miembro</option>
                    <option value="admin">Administrador</option>
                    <option value="bibliotecario">Bibliotecario</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Estado</label>
                <select class="form-select" [(ngModel)]="usuario.estado" name="estado">
                    <option value="activo">Activo</option>
                    <option value="bloqueado">Bloqueado</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-success" [disabled]="!userForm.form.valid">Guardar</button>
        <a routerLink="/usuarios" class="btn btn-secondary ms-2">Cancelar</a>
    </form>
</div>
