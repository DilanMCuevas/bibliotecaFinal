<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="card-title fw-bold text-primary mb-4">{{ titulo }}</h2>

            <form (ngSubmit)="guardar()" #form="ngForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <select class="form-select" id="usuario" required
                                [(ngModel)]="multa.usuarioId" name="usuarioId"
                                [disabled]="isEditMode"> <!-- No cambiar usuario en edicion por simplicidad -->
                            <option [ngValue]="0" disabled>Seleccione un usuario</option>
                            <option *ngFor="let u of usuarios" [ngValue]="u.id">
                                {{ u.nombre }} ({{ u.email }})
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="monto" class="form-label">Monto ($)</label>
                        <input type="number" class="form-control" id="monto" required min="1"
                               [(ngModel)]="multa.monto" name="monto">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo</label>
                    <textarea class="form-control" id="motivo" rows="3" required
                              [(ngModel)]="multa.motivo" name="motivo"
                              placeholder="Describe la razón de la multa..."></textarea>
                </div>

                <div class="mb-3">
                     <label for="estado" class="form-label">Estado</label>
                     <select class="form-select" id="estado" required [(ngModel)]="multa.estado" name="estado">
                         <option value="PENDIENTE">PENDIENTE</option>
                         <option value="PAGADA">PAGADA</option>
                     </select>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="button" class="btn btn-outline-secondary" routerLink="/multas">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4" [disabled]="!form.valid">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
