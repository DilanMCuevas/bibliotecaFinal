<div class="container mt-4">
    <h2>Catálogo de Autores</h2>

    <div *ngIf="loading" class="text-center my-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2">Cargando datos...</p>
    </div>

    <div *ngIf="!loading && error" class="alert alert-danger">
        Error al conectar con el servidor. Por favor intenta más tarde.
    </div>

    <div *ngIf="!loading && !error && autores.length === 0" class="alert alert-info">
        No hay autores registrados.
    </div>

    <table *ngIf="!loading && !error && autores.length > 0" class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Biografía</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let autor of autores">
                <td>{{ autor.id }}</td>
                <td>{{ autor.nombre }}</td>
                <td>{{ autor.bio }}</td>
            </tr>
        </tbody>
    </table>
</div>
