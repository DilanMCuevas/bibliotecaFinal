<div class="container mt-4">
    <h2>Catálogo de Autores</h2>
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Biografía</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let autor of autores">
                <td>{{ autor.id }}</td>
                <td>{{ autor.nombre }}</td>
                <td>{{ autor.bio }}</td>
            </tr>
        </tbody>
    </table>
    <div *ngIf="autores.length === 0" class="alert alert-info">
        No hay autores registrados.
    </div>
</div>
