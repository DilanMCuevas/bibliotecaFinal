<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Registrar Nuevo Autor</h4>
                </div>
                <div class="card-body">
                    <div *ngIf="errorMessage" class="alert alert-danger">
                        {{ errorMessage }}
                    </div>

                    <form (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" [(ngModel)]="autor.nombre"
                                   name="nombre" required placeholder="Ej. Gabriel García Márquez">
                        </div>

                        <div class="mb-3">
                            <label for="bio" class="form-label">Biografía</label>
                            <textarea class="form-control" id="bio" [(ngModel)]="autor.bio"
                                      name="bio" rows="4" placeholder="Breve descripción..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a routerLink="/autores" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary" [disabled]="loading">
                                <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                                Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
