<div class="login-container">
    <h2 class="login-title">Iniciar Sesión</h2>

    <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" class="form-control" required placeholder="tu@email.com">
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-login" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
    </form>

    <div class="register-link">
        ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </div>
</div>
