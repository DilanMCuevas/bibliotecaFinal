<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Registro de Usuario</h3>

                <div *ngIf="error" class="alert alert-danger" role="alert">
                    {{ error }}
                </div>

                <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="nombre"
                            [(ngModel)]="usuario.nombre"
                            required
                            minlength="3"
                            placeholder="Tu nombre">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            [(ngModel)]="usuario.email"
                            required
                            email
                            placeholder="nombre@ejemplo.com">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            [(ngModel)]="usuario.password"
                            required
                            minlength="6"
                            placeholder="Mínimo 6 caracteres">
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirmPassword"
                            [(ngModel)]="confirmPasswordVal"
                            required
                            placeholder="Repite tu contraseña">
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success" [disabled]="!registerForm.form.valid || loading">
                            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            {{ loading ? 'Registrando...' : 'Registrarse' }}
                        </button>
                    </div>
                </form>

                <div class="mt-4 text-center">
                    <p class="mb-0">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
