<div class="login-container">
    <h2 class="login-title">Crear Cuenta</h2>

    <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="nombre" class="form-label">Nombre Completo</label>
            <input type="text" id="nombre" [(ngModel)]="usuario.nombre" name="nombre" class="form-control" required placeholder="Tu Nombre">
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" id="email" [(ngModel)]="usuario.email" name="email" class="form-control" required placeholder="tu@email.com">
            <small class="text-muted d-block mt-1">Te enviaremos tus credenciales a este correo.</small>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" [(ngModel)]="usuario.password" name="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-login" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            {{ loading ? 'Registrando...' : 'Registrarse' }}
        </button>
    </form>

    <div class="register-link">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión aquí</a>
    </div>
</div>
