<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Categorías</h2>
        <!-- Botón Nuevo -->
        <a routerLink="/categorias/nueva" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Nueva
        </a>
    </div>

    <!-- Barra de Herramientas (Filtro) -->
    <div class="row mb-3">
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" placeholder="Filtrar por nombre..."
                       [(ngModel)]="filtro" (input)="filtrar()">
            </div>
        </div>
    </div>

    <div *ngIf="loading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <div *ngIf="!loading && !error && categorias.length === 0" class="alert alert-info">
      No hay categorías registradas.
    </div>

    <div class="table-responsive" *ngIf="!loading && !error && categorias.length > 0">
      <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cat of categoriasFiltradas">
            <td>{{ cat.id }}</td>
            <td>{{ cat.nombre }}</td>
            <td>{{ cat.descripcion }}</td>
            <td class="text-end">
              <button class="btn btn-outline-primary btn-sm me-1" [routerLink]="['/categorias/editar', cat.id]">
                 <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-outline-danger btn-sm" (click)="eliminar(cat.id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
